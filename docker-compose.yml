version: '3.8'

services:
  memory-test:
    image: golang:1.21
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      - GOMEMLIMIT=350MiB             # Go runtime limit (slightly under Docker limit)
      - MEMORY_LIMIT_MB=400           # Application-level limit for middleware
      - MEMORY_WARNING_MB=300         # Warning threshold (75% of limit by default)
      - MEMORY_QUEUE_SIZE=100         # Maximum number of queued requests
      - MEMORY_QUEUE_TIMEOUT_SEC=30   # Queue timeout in seconds
      - MEMORY_RETRY_AFTER=10         # Retry-After header value for overloaded responses
    command: go run main.go
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
